<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <style>
    .box {
      width: 100px;
      height: 70px;
      background-color: teal;
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 100px;
      left: 0px;
      border-radius: 8px;
      cursor: pointer;
    }

    .board {
      height: 100vh;
    }
  </style>
</head>

<body class="board">
  <!-- HTML for the box -->
  <div class="box">0</div>

  <script>
    (function () {
      'use strict';
      /* global jQuery */

      var box = jQuery('.box');
      var board = jQuery('.board');
      var boardWidth = board.width() - box.width();

      setInterval(update, 50);
      box.on('click', handleBoxClick);

      var positionX = 0;
      var points = 0;
      var speed = 10;

      function moveBoxTo(newPositionX) {
        box.css("left", newPositionX);
      }

      function changeBoxText(newText) {
        box.text(newText);
      }

      function update() {
        positionX = positionX + speed;
        moveBoxTo(positionX);

        if (positionX > boardWidth) {
          speed *= -1;
        }

        if (positionX < 0) {
          speed *= -1;
        }
      }

      function handleBoxClick() {
        positionX = 0;
        points++;
        speed = 3 * points + 10;
        changeBoxText(points);
      }
    })();
  </script>
</body>

</html>
